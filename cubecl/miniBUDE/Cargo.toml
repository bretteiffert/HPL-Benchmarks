[package]
name = "miniBUDE"
version = "0.1.0"
edition = "2024"
# Enable exactly one backend: --features cuda, or --features hip.
[features]
cuda = ["cubecl/cuda"]
hip = ["cubecl/hip"]

[dependencies]
cubecl = { version = "=0.10.0", default-features = false }
cubecl-runtime = "=0.10.0"
cubecl-core = "=0.10.0"
# Loads the vendor driver library at runtime to query the driver version.
libloading = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
